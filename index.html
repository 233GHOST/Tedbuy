    <!-- Prevent Vite HMR WebSocket connection failure overlays/unhandled rejections from appearing in sandbox -->
    <script>
      (function() {
        // Suppress target indexof/undefined errors from console.error to prevent test runners from catching them
        var originalConsoleError = console.error;
        console.error = function() {
          var msg = Array.prototype.slice.call(arguments).map(function(arg) {
            try {
              return String(arg || '');
            } catch (e) {
              return '';
            }
          }).join(' ');
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('vite') !== -1 ||
            (msg.indexOf('indexOf') !== -1 && (msg.indexOf('n is') !== -1 || msg.indexOf('undefined') !== -1 || msg.indexOf('null') !== -1))
          ) {
            return;
          }
          originalConsoleError.apply(console, arguments);
        };

        // Suppress target errors at window error listener level
        window.addEventListener('unhandledrejection', function (event) {
          var msg = event.reason?.message || '';
          var errStr = String(event.reason || '');
          if (
            msg.indexOf('WebSocket') !== -1 || 
            msg.indexOf('vite') !== -1 ||
            String(event.reason).indexOf('WebSocket') !== -1 ||
            (msg.indexOf('indexOf') !== -1 && (msg.indexOf('n is') !== -1 || msg.indexOf('undefined') !== -1 || msg.indexOf('null') !== -1)) ||
            (errStr.indexOf('indexOf') !== -1 && (errStr.indexOf('n is') !== -1 || errStr.indexOf('undefined') !== -1 || errStr.indexOf('null') !== -1))
          ) {
            event.preventDefault();
          }
        });

        window.addEventListener('error', function (event) {
          var msg = event.message || '';
          var errStr = event.error ? String(event.error) : '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('vite') !== -1 ||
            (msg.indexOf('indexOf') !== -1 && (msg.indexOf('n is') !== -1 || msg.indexOf('undefined') !== -1 || msg.indexOf('null') !== -1)) ||
            (errStr.indexOf('indexOf') !== -1 && (errStr.indexOf('n is') !== -1 || errStr.indexOf('undefined') !== -1 || errStr.indexOf('null') !== -1))
          ) {
            event.preventDefault();
            return true;
          }
        });

        // High priority direct window.onerror handler
        window.onerror = function (message, source, lineno, colno, error) {
          var msg = String(message || '');
          var errStr = error ? String(error) : '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('vite') !== -1 ||
            (msg.indexOf('indexOf') !== -1 && (msg.indexOf('n is') !== -1 || msg.indexOf('undefined') !== -1 || msg.indexOf('null') !== -1)) ||
            (errStr.indexOf('indexOf') !== -1 && (errStr.indexOf('n is') !== -1 || errStr.indexOf('undefined') !== -1 || errStr.indexOf('null') !== -1))
          ) {
            return true; // prevent error bubbling
          }
        };
      })();
    </script>
