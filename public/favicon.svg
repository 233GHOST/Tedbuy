<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bagGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#151e2e" />
      <stop offset="100%" stop-color="#0b111e" />
    </linearGradient>
    <linearGradient id="handleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="subtle-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#subtle-shadow)">
    <!-- Bag Handle (Arched Top) -->
    <path d="M 172,180 C 172,110 210,72 256,72 C 302,72 340,110 340,180" 
          stroke="url(#handleGradient)" 
          stroke-width="36" 
          fill="none" 
          stroke-linecap="round" />
    
    <!-- Bag Body with Smooth Rounded Corners & Shoulders -->
    <path d="M 124,172 L 388,172 C 408,172 422,188 419,208 L 389,442 C 386,460 371,474 353,474 L 159,474 C 141,474 126,460 123,442 L 93,208 C 90,188 104,172 124,172 Z" 
          fill="url(#bagGradient)" />
    
    <!-- Bold 'T' Letter (Clean Modern Geometry with Rounded Caps) -->
    <!-- Top Horizontal Bar -->
    <rect x="166" y="232" width="180" height="44" rx="16" fill="#ffffff" />
    <!-- Vertical Center Stem -->
    <rect x="234" y="232" width="44" height="144" rx="16" fill="#ffffff" />
    
    <!-- Signature Vibrant Cyan / Sky Blue Dot -->
    <circle cx="256" cy="418" r="14" fill="#38bdf8" />
  </g>
</svg>
